<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HTML Anything</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0b0f;
    color: #e7e7ea;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    user-select: none;
  }
  .logo {
    width: 96px; height: 96px;
    border-radius: 24px;
    background: conic-gradient(from 210deg, #6d5cff, #38c6ff, #6d5cff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(109, 92, 255, 0.35);
  }
  .logo::after {
    content: "";
    width: 0; height: 0;
    border-left: 22px solid #0b0b0f;
    border-right: 12px solid transparent;
    border-bottom: 34px solid #0b0b0f;
    transform: translate(2px, -4px);
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; margin: 0; }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #6d5cff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  p { color: #9a9aa3; font-size: 13px; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo"></div>
  <h1>HTML Anything</h1>
  <div class="spinner"></div>
  <p>正在启动本地服务…</p>
</body>
</html>
